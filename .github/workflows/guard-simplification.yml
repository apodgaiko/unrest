name: Guard replacement kernel controls

on:
  push:
    branches: ['codex/guard-simplification-v047']
  workflow_dispatch:
    inputs:
      source_group:
        description: 'Exact original case group; none runs only kernel/admission controls'
        type: choice
        default: none
        options: [none, archives15, full-collect, preflight54, preflight9, controlled-root-http7, controlled-notification-signals16, controlled-notification-startup8, controlled-warning4, controlled-admission6, controlled-private8, controlled-probes4, controlled-large8, controlled-initialize1, controlled-startup1, controlled-cancel1, controlled-ack20, controlled-bridge1, controlled-drain3, controlled-capacity10, controlled-batches4, controlled-orders-PP, controlled-orders-RP, controlled-orders-RC, controlled-orders-RR, controlled-stops12, controlled-halt15, controlled-cancellation4, controlled-registration4, controlled-witness1, imports6, stdio8, observe1, mp-status2, mp-tracker3, mp-tracker5, mp-ipc2, mp-attention1, mp-patch2, mp-lock3, mp-supervision3, mp-finalization13, mp-nested11, mp-paths11, mp-transactions21, mp-transactions12, mp-terminal1, review-wire24, session-timeout, sessions69, workspaces24, bootstrap27, ordinary42, cleanup7, cleanup9, cleanup5, cleanup-review3, cleanup12, cleanup15]

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: '0.11.8'
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked
      - name: Bounded kernel and source-admission controls
        if: github.event_name == 'push' || inputs.source_group == 'none'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: timeout --signal=TERM --kill-after=5 120 uv run --no-sync pytest -q -o faulthandler_timeout=15 .github/release-guard
      - name: Actual mixed-user cleanup without CAP_KILL
        if: github.event_name == 'push' || inputs.source_group == 'none'
        run: sudo -n env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=5 60 "$PWD/.venv/bin/python" -I -B .github/release-guard/test_mixed_uid_control.py
      - name: Build pinned CPython native control entry
        run: uv run --no-sync python .github/release-guard/native_build.py
      - name: Actual native prebody and caught-refusal controls
        if: github.event_name == 'push' || inputs.source_group == 'none'
        run: sudo -n env -i PATH=/usr/bin:/bin timeout --signal=TERM --kill-after=5 120 "$PWD/.venv/bin/python" -I -B "$PWD/.github/release-guard/test_native_entry_control.py" "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/binding.json"
      - name: Exact original source case group
        if: github.event_name == 'workflow_dispatch' && inputs.source_group != 'none' && inputs.source_group != 'archives15'
        run: sudo -n env -i PATH=/usr/bin:/bin timeout --signal=TERM --kill-after=5 240 "$PWD/.venv/bin/python" -I -B "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/support/source_host.py" "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/binding.json" "${{ inputs.source_group }}"
      - name: Exact archive and extracted persistence integration
        if: github.event_name == 'workflow_dispatch' && inputs.source_group == 'archives15'
        run: |
          uv build
          sudo -n env -i PATH=/usr/bin:/bin "$PWD/.venv/bin/python" -I -B "$PWD/.github/release-guard/package_check.py" "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/binding.json"
      - name: Retain encrypted native control diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: native-control-private
          path: /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/native-control-private.cms
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain encrypted original-source diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-integration-private
          path: |
            /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/source-private.cms
            /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/archive-private.cms
          if-no-files-found: ignore
          retention-days: 7
