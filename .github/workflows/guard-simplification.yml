name: Guard replacement kernel controls

on:
  push:
    branches: ['codex/guard-simplification-v047']
  workflow_dispatch:
    inputs:
      source_group:
        description: 'Exact original case group; none runs only kernel/admission controls'
        type: choice
        default: none
        options: [none, controlled-cancel1, controlled-ack20, controlled-bridge1, controlled-drain3, controlled-orders30, controlled-stops12, controlled-halt15, controlled-wrappers9, imports6, session-timeout, sessions69, workspaces24, bootstrap27, ordinary42, cleanup7, cleanup9, cleanup5, cleanup-review3, cleanup12, cleanup15]

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked
      - name: Bounded kernel and source-admission controls
        if: github.event_name == 'push' || inputs.source_group == 'none'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: timeout --signal=TERM --kill-after=5 120 uv run --no-sync pytest -q -o faulthandler_timeout=15 .github/release-guard
      - name: Actual mixed-user cleanup without CAP_KILL
        if: github.event_name == 'push' || inputs.source_group == 'none'
        run: sudo -n env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=5 60 "$PWD/.venv/bin/python" -I -B .github/release-guard/test_mixed_uid_control.py
      - name: Build pinned CPython native control entry
        run: uv run --no-sync python .github/release-guard/native_build.py
      - name: Actual native prebody and caught-refusal controls
        if: github.event_name == 'push' || inputs.source_group == 'none'
        run: sudo -n env -i PATH=/usr/bin:/bin timeout --signal=TERM --kill-after=5 120 "$PWD/.venv/bin/python" -I -B "$PWD/.github/release-guard/test_native_entry_control.py" "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/binding.json"
      - name: Exact original source case group
        if: github.event_name == 'workflow_dispatch' && inputs.source_group != 'none'
        run: sudo -n env -i PATH=/usr/bin:/bin timeout --signal=TERM --kill-after=5 240 "$PWD/.venv/bin/python" -I -B "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/support/source_host.py" "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/binding.json" "${{ inputs.source_group }}"
      - name: Retain encrypted native control diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: native-control-private
          path: /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/native-control-private.cms
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain encrypted original-source diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-integration-private
          path: /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/source-private.cms
          if-no-files-found: ignore
          retention-days: 7
