name: Guard replacement kernel controls

on:
  push:
    branches: ['codex/guard-simplification-v047']
  workflow_dispatch:
    inputs:
      source_group:
        description: 'Exact original case group; none runs only kernel/admission controls'
        type: choice
        default: none
        options: [none, source, archives15, network-only]
      source_selectors:
        description: 'JSON list of exact original tests/*.py selectors; diagnostics only'
        type: string
        default: '[]'


permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: '0.11.8'
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked
      - name: Bounded kernel and source-admission controls
        if: github.event_name == 'push' || inputs.source_group == 'none'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: timeout --signal=TERM --kill-after=5 120 uv run --no-sync pytest -q -o faulthandler_timeout=15 .github/release-guard
      - name: Actual mixed-user cleanup without CAP_KILL
        if: github.event_name == 'push' || inputs.source_group == 'none'
        run: sudo -n env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=5 60 "$PWD/.venv/bin/python" -I -B .github/release-guard/test_mixed_uid_control.py
      - name: Actual isolated loopback and host-service exclusion
        if: github.event_name == 'push' || inputs.source_group == 'none' || inputs.source_group == 'network-only'
        run: sudo -n env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=5 20 "$PWD/.venv/bin/python" -I -B "$PWD/.github/release-guard/test_network_scope_native.py"
      - name: Actual empty filesystem root and escape negatives
        if: github.event_name == 'push' || inputs.source_group == 'none'
        run: sudo -n env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=5 20 "$PWD/.venv/bin/python" -I -B "$PWD/.github/release-guard/test_filesystem_scope_native.py"
      - name: Build pinned CPython native control entry
        if: inputs.source_group != 'network-only'
        run: uv run --no-sync python .github/release-guard/native_build.py
      - name: Actual native prebody and caught-refusal controls
        if: github.event_name == 'push' || inputs.source_group == 'none'
        run: sudo -n env -i PATH=/usr/bin:/bin timeout --signal=TERM --kill-after=5 120 "$PWD/.venv/bin/python" -I -B "$PWD/.github/release-guard/test_native_entry_control.py" "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/binding.json"
      - name: Normal original-source diagnostic selection
        if: github.event_name == 'workflow_dispatch' && inputs.source_group == 'source'
        env:
          SOURCE_SELECTORS: ${{ inputs.source_selectors }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          selected=json.loads(os.environ['SOURCE_SELECTORS'])
          if type(selected) is not list or any(type(value) is not str for value in selected):
              raise RuntimeError('source selector list required')
          if not selected or any(not value.startswith('tests/') for value in selected):
              raise RuntimeError('diagnostic source selection must name original tests')
          root=Path('/tmp')/('unrest-native-control-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])/'guard-native-control'
          subprocess.run(['sudo','-n','env','-i','PATH=/usr/bin:/bin','timeout','--signal=TERM','--kill-after=5','240',
              str(Path.cwd()/'.venv/bin/python'),'-I','-B',str(root/'support/source_host.py'),str(root/'binding.json'),*selected],check=True)
          PY
      - name: Exact archive and extracted persistence integration
        if: github.event_name == 'workflow_dispatch' && inputs.source_group == 'archives15'
        run: |
          uv build
          sudo -n env -i PATH=/usr/bin:/bin "$PWD/.venv/bin/python" -I -B "$PWD/.github/release-guard/package_check.py" "/tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/binding.json"
      - name: Retain encrypted native control diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: native-control-private
          path: /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/native-control-private.cms
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain encrypted original-source diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-integration-private
          path: |
            /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/source-private.cms
            /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/archive-private.cms
          if-no-files-found: ignore
          retention-days: 7
