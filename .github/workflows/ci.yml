name: CI

on:
  push:
    branches: [main, 'codex/release-v047-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: v047-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  primary:
    name: full source and package gate (py3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: '0.11.8'
          python-version: '3.13'
          enable-cache: false
      - name: Locked dependency environment
        run: uv sync --locked
      - name: Guard size and admission controls
        run: |
          uv run python .github/release-guard/size_budget.py --root "$PWD" --test-support tools/check_distribution.py --check
          timeout --signal=TERM --kill-after=5 120 uv run --no-sync pytest -q .github/release-guard
      - name: Package imports and supported CLI surfaces
        run: |
          uv run python -c "import unrest_harness; from unrest_harness.config import HarnessConfig; HarnessConfig.discover()"
          uv run unrest --help
          uv run unrest measure-baseline --help
          uv run unrest-server --help
          uv run python -m unrest_harness --help
      - name: Recursive static and repository checks
        run: |
          uv run ruff check .
          uv run mypy src
          uv run unrest check-repository
      - name: Build the fixed native test entry
        run: uv run --no-sync python .github/release-guard/native_build.py
      - name: Full unexcluded Python 3.13 source checkpoint
        run: env -u CODEX_PATH uv run pytest -q
        shell: python3 .github/release-guard/ci_shell.py {0}
      - name: Build wheel and source distribution
        run: uv build
      - name: Complete archive bytes and guarded extracted fifteen-case persistence oracle
        run: uv run python tools/check_distribution.py dist
        shell: python3 .github/release-guard/ci_shell.py {0}
      - name: Smoke-test installed wheel
        run: |
          uv venv --clear .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest" --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest" measure-baseline --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest-server" --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -m unrest_harness --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c "from unrest_harness.config import HarnessConfig; assert HarnessConfig.discover().capability_policy.schema_version == 1"
          env -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN -u CODEX_API_KEY -u GLM_API_KEY -u OPENAI_API_KEY -u ZAI_API_KEY "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -m unrest_harness.installed_wheel_check
          set +e
          output="$(UNREST_CAPABILITY_PROFILE=unsupported "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest-server" --mode orchestrator 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = "unrest-server: startup configuration rejected"
      - name: Generate and verify v0.4.7 build-local checksums
        run: |
          test -f dist/unrest_harness-0.4.7-py3-none-any.whl
          test -f dist/unrest_harness-0.4.7.tar.gz
          cd dist
          sha256sum \
            unrest_harness-0.4.7-py3-none-any.whl \
            unrest_harness-0.4.7.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Upload verified release archives
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unrest-v0.4.7-python313
          path: |
            dist/unrest_harness-0.4.7-py3-none-any.whl
            dist/unrest_harness-0.4.7.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Preserve encrypted native source and archive evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-native-private
          path: |
            /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/source-private.cms
            /tmp/unrest-native-control-${{ github.run_id }}-${{ github.run_attempt }}/guard-native-control/archive-private.cms
          if-no-files-found: ignore
          retention-days: 90
