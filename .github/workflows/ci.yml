name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unrest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy)
        run: uv run mypy src
      - name: Test (pytest)
        run: uv run pytest -q
      - name: Test research analyzer
        run: uv run pytest -q ../research/2026-07-production-log-mission/test_analyze_trace.py
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke-test installed wheel
        run: |
          uv venv --clear .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/unrest/.wheel-venv/bin/unrest" --help
          "$GITHUB_WORKSPACE/unrest/.wheel-venv/bin/unrest-server" --help
          "$GITHUB_WORKSPACE/unrest/.wheel-venv/bin/python" -m unrest_harness --help
          "$GITHUB_WORKSPACE/unrest/.wheel-venv/bin/python" -c "import unrest_harness"
