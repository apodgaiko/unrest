name: v0.4.6 owned multiprocessing controls

on:
  push:
    branches:
      - 'codex/source-guard-owned-multiprocess-20261019-01'
      - 'codex/source-guard-owned-multiprocess-20261019-02'
      - 'codex/source-guard-owned-multiprocess-20261019-03'
      - 'codex/source-guard-owned-multiprocess-20261019-04'
      - 'codex/source-guard-owned-multiprocess-20261019-05'
      - 'codex/source-guard-owned-multiprocess-20261019-06'

permissions:
  contents: read

jobs:
  descriptors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Install locked controlled dependencies
        run: uv sync --locked
      - name: Actual guard descriptor lifetime controls only
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          sudo install -d -m 0700 -o 20000 -g 20000 "$RUNNER_TEMP/owned-multiprocess"
          sudo unshare --mount --net /bin/bash -euc '
            mount --make-rprivate /
            mount --bind "$1" "$1"
            mount -o remount,bind,ro "$1"
            ip link set lo up
            exec setpriv --reuid=20000 --regid=20000 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs "$1/.venv/bin/python" -B "$1/.github/release-source-guard/multiprocess_guard_controls.py" "$2/result"
          ' controls "$GITHUB_WORKSPACE" "$RUNNER_TEMP/owned-multiprocess" > "$RUNNER_TEMP/ownership.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/ownership-status"
          sudo tar --exclude='owned-multiprocess/result/pytest' --exclude='*.sock' -czf "$RUNNER_TEMP/ownership.tar.gz" -C "$RUNNER_TEMP" owned-multiprocess ownership.log ownership-status
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/ownership.tar.gz" -outform DER -out "$RUNNER_TEMP/ownership.cms" .github/release-source-guard/evidence-recipient.pem
          exit "$status"
      - name: Retain encrypted original control evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ownership.cms
          if-no-files-found: error
          retention-days: 30
