name: v0.4.6 owned multiprocessing controls

on:
  push:
    branches:
      - 'codex/source-guard-mp-extension-20261019-01'
      - 'codex/source-guard-mp-extension-20261019-02'
      - 'codex/source-guard-mp-extension-20261019-03'
      - 'codex/source-guard-mp-extension-20261019-04'
      - 'codex/source-guard-mp-extension-20261019-05'
      - 'codex/source-guard-mp-extension-20261019-06'
      - 'codex/source-guard-mp-extension-20261019-07'
      - 'codex/source-guard-mp-extension-20261019-08'

permissions:
  contents: read

jobs:
  descriptors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Install locked controlled dependencies
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          (
            set -e
            uv sync --locked
            runtime_root="$(uv run --no-sync python -B -c 'import sys; print(sys.base_prefix)')"
            sudo cp -a "$runtime_root" /opt/owned-multiprocess-python
            sudo chmod -R a+rX /opt/owned-multiprocess-python
            uv run --no-sync python -B .github/release-source-guard/runtime_copy_metadata.py /opt/owned-multiprocess-python "$RUNNER_TEMP/runtime-copy.json"
            sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /opt/owned-multiprocess-source
            git -c tar.umask=0022 archive HEAD | tar -x -C /opt/owned-multiprocess-source
            uv venv --python /opt/owned-multiprocess-python/bin/python3.13 /opt/owned-multiprocess-source/.venv
            uv sync --locked --directory /opt/owned-multiprocess-source --python /opt/owned-multiprocess-python/bin/python3.13
            chmod -R a+rX /opt/owned-multiprocess-source
            uv run --no-sync python -B .github/release-source-guard/owned_source_metadata.py /opt/owned-multiprocess-source "$RUNNER_TEMP/source-copy.json"
          ) > "$RUNNER_TEMP/preparation.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/preparation-status"
          exit "$status"
      - name: Actual guard descriptor lifetime controls only
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          if [ "$(cat "$RUNNER_TEMP/preparation-status")" = 0 ]; then
          sudo install -d -m 0700 -o 20000 -g 20000 /opt/owned-multiprocess-work
          sudo unshare --mount --net /bin/bash -euc '
            mount --make-rprivate /
            mount --bind "$1" "$1"
            mount -o remount,bind,ro "$1"
            mount --bind /opt/owned-multiprocess-python /opt/owned-multiprocess-python
            mount -o remount,bind,ro /opt/owned-multiprocess-python
            ip link set lo up
            exec setpriv --reuid=20000 --regid=20000 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs "$1/.venv/bin/python" -B "$1/.github/release-source-guard/multiprocess_guard_controls.py" "$2/result"
          ' controls /opt/owned-multiprocess-source /opt/owned-multiprocess-work > "$RUNNER_TEMP/ownership.log" 2>&1
          status=$?
          else
          status="$(cat "$RUNNER_TEMP/preparation-status")"
          fi
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/ownership-status"
          sudo /usr/bin/python3 -B .github/release-source-guard/control_retention.py "$RUNNER_TEMP" "$RUNNER_TEMP/ownership.tar.gz" /opt/owned-multiprocess-work
          sudo openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/ownership.tar.gz" -outform DER -out "$RUNNER_TEMP/ownership.cms" .github/release-source-guard/evidence-recipient.pem
          sudo chmod 0644 "$RUNNER_TEMP/ownership.cms"
          exit "$status"
      - name: Retain encrypted original control evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ownership.cms
          if-no-files-found: error
          retention-days: 30
