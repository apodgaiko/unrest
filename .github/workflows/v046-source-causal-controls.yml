name: v0.4.6 finite guard causal controls

on:
  push:
    branches:
      - 'codex/source-guard-full-causal-20261019-01'
      - 'codex/source-guard-full-causal-20261019-02'
      - 'codex/source-guard-full-causal-20261019-03'
      - 'codex/source-guard-full-causal-20261019-04'
      - 'codex/source-guard-full-causal-20261019-05'
      - 'codex/source-guard-full-causal-20261019-06'

permissions:
  contents: read

jobs:
  descriptors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Install locked controlled dependencies
        run: uv sync --locked
      - name: Actual guard descriptor lifetime controls only
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          uv run --no-sync python -B .github/release-source-guard/descriptor_diagnosis.py "$RUNNER_TEMP/causal" > "$RUNNER_TEMP/causal.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/causal-status"
          tar -czf "$RUNNER_TEMP/causal.tar.gz" -C "$RUNNER_TEMP" causal causal.log causal-status
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/causal.tar.gz" -outform DER -out "$RUNNER_TEMP/causal.cms" .github/release-source-guard/evidence-recipient.pem
          exit "$status"
      - name: Retain encrypted original control evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-causal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/causal.cms
          if-no-files-found: error
          retention-days: 30
