name: v0.4.6 source guard readiness

on:
  push:
    branches:
      - 'codex/source-guard-structured-20261018-*'

permissions:
  contents: read

concurrency:
  group: v046-source-checkpoint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compartment-controls:
    name: Linux compartment controls (not a source checkpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic kernel and observer controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Install dependencies
        run: uv sync --locked
        shell: python3 .github/release-source-guard/ci_shell.py {0}
      - name: Upload encrypted primary-install evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-primary-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-install/evidence.cms
            ${{ runner.temp }}/primary-install/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Import package
        run: uv run python -c "import unrest_harness; from unrest_harness.config import HarnessConfig; HarnessConfig.discover()"
        shell: python3 .github/release-source-guard/ci_shell.py {0}
      - name: Upload encrypted primary-import evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-primary-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-import/evidence.cms
            ${{ runner.temp }}/primary-import/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Supported CLI surfaces
        run: |
          uv run unrest --help
          uv run unrest measure-baseline --help
          uv run unrest-server --help
          uv run python -m unrest_harness --help
        shell: python3 .github/release-source-guard/ci_shell.py {0}
      - name: Upload encrypted primary-help evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-primary-help-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-help/evidence.cms
            ${{ runner.temp }}/primary-help/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Repository contract
        run: uv run unrest check-repository
        shell: python3 .github/release-source-guard/ci_shell.py {0}
      - name: Upload encrypted primary-repository evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-primary-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-repository/evidence.cms
            ${{ runner.temp }}/primary-repository/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload primary typed startup stage
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-host-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-host-stage.json
            ${{ runner.temp }}/primary-image-stage.json
          if-no-files-found: error
      - name: Original CI mutation assertions
        if: always()
        run: python3 .github/release-source-guard/source_controller.py "$RUNNER_TEMP/ci-mutations" "$RUNNER_TEMP/source-readiness" ci-mutations
      - name: Upload encrypted CI mutation evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-ci-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-mutations/evidence.cms
            ${{ runner.temp }}/ci-mutations/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted control evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
