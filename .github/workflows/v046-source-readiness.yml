name: v0.4.6 source guard readiness

on:
  push:
    branches:
      - 'codex/source-guard-structured-20261018-*'

permissions:
  contents: read

concurrency:
  group: v046-source-checkpoint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compartment-controls:
    if: ${{ github.ref != 'refs/heads/codex/source-guard-structured-20261018-source-composition-startup-cancel-20261021' && github.ref != 'refs/heads/codex/source-guard-structured-20261018-source-composition-postimages-20261022' }}
    name: Linux compartment controls (not a source checkpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Synthetic kernel and observer controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Physical FULL input controls on trusted host
        if: ${{ contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: python3 .github/release-source-guard/full_input_controls.py
      - name: Prepare current FULL input on trusted host
        if: ${{ contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: python3 .github/release-source-guard/full_bootstrap.py PREPAREONLY
      - name: Prepare FULL capsule without SOURCE dispatch
        if: ${{ contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: env -u CODEX_PATH uv run pytest -q
        shell: python3 .github/release-source-guard/ci_shell.py --prepare-full {0}
      - name: Upload dispatch-free FULL preparation
        if: ${{ always() && contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-full-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-source/preparation.json
            ${{ runner.temp }}/full-host-controls.json
          if-no-files-found: error
      - name: TEST original PRIMARY build producer
        if: ${{ !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: uv build
        shell: python3 .github/release-source-guard/ci_shell.py --package-test {0}
      - name: TEST original PRIMARY archive consumer
        if: ${{ !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: uv run python tools/check_distribution.py dist
        shell: python3 .github/release-source-guard/ci_shell.py --package-test {0}
      - name: TEST original PRIMARY installed consumer
        if: ${{ !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: |
          uv venv --clear .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest" --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest" measure-baseline --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest-server" --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -m unrest_harness --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c "from unrest_harness.config import HarnessConfig; assert HarnessConfig.discover().capability_policy.schema_version == 1"
          env -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN -u CODEX_API_KEY -u GLM_API_KEY -u OPENAI_API_KEY -u ZAI_API_KEY "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -m unrest_harness.installed_wheel_check
          set +e
          output="$(UNREST_CAPABILITY_PROFILE=unsupported "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest-server" --mode orchestrator 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = "unrest-server: startup configuration rejected"
        shell: python3 .github/release-source-guard/ci_shell.py --package-test {0}
      - name: Upload encrypted TEST package installed evidence
        if: ${{ always() && !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-package-installed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-package-installed/evidence.cms
            ${{ runner.temp }}/primary-package-installed/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: TEST original PRIMARY checksum consumer
        if: ${{ !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: |
          test -f dist/unrest_harness-0.4.7-py3-none-any.whl
          test -f dist/unrest_harness-0.4.7.tar.gz
          cd dist
          sha256sum \
            unrest_harness-0.4.7-py3-none-any.whl \
            unrest_harness-0.4.7.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
        shell: python3 .github/release-source-guard/ci_shell.py --package-test {0}
      - name: Upload encrypted TEST package checksum evidence
        if: ${{ always() && !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-package-checksum-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-package-checksum/evidence.cms
            ${{ runner.temp }}/primary-package-checksum/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted TEST package archive evidence
        if: ${{ always() && !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-package-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-package-archive/evidence.cms
            ${{ runner.temp }}/primary-package-archive/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted TEST package build evidence
        if: ${{ always() && !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-package-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-package-build/evidence.cms
            ${{ runner.temp }}/primary-package-build/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload primary typed startup stage
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-host-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-host-stage.json
            ${{ runner.temp }}/primary-image-stage.json
          if-no-files-found: error
      - name: Upload encrypted control evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
          if-no-files-found: error
          retention-days: 30

  startup-cancellation-diagnosis:
    name: Bounded startup cancellation diagnosis (not certification)
    if: ${{ github.ref == 'refs/heads/codex/source-guard-structured-20261018-source-composition-startup-cancel-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Original compartment controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Original first completion and cleanup cases
        run: env -u CODEX_PATH uv run pytest -q tests/test_completion_setup.py::test_real_roles_first_use[invalid-invalid-work-targets0] tests/test_completion_setup.py::test_real_roles_first_use[invalid-invalid-work-targets1] tests/test_completion_setup.py::test_real_roles_first_use[invalid-invalid-validate-targets2] tests/test_completion_setup.py::test_real_roles_first_use[valid-invalid-work-targets0] tests/test_completion_setup.py::test_real_roles_first_use[valid-invalid-work-targets1] tests/test_completion_setup.py::test_real_roles_first_use[valid-invalid-validate-targets2] tests/test_completion_setup.py::test_real_roles_first_use[valid-valid-work-targets0] tests/test_completion_setup.py::test_real_roles_first_use[valid-valid-work-targets1] tests/test_completion_setup.py::test_real_roles_first_use[valid-valid-validate-targets2] tests/test_completion_setup.py::test_real_roles_first_use[distinct-work-targets0] tests/test_completion_setup.py::test_real_roles_first_use[distinct-work-targets1] tests/test_completion_setup.py::test_real_roles_first_use[distinct-validate-targets2] tests/test_acp_runner.py::test_run_node_with_mock_agent tests/test_acp_cleanup.py::test_recorded_transport_failures[success-work] tests/test_acp_cleanup.py::test_recorded_transport_failures[success-validate] tests/test_acp_cleanup.py::test_recorded_transport_failures[success-terminal_reviewer]
        shell: python3 .github/release-source-guard/ci_shell.py --source-test TEST-positive {0}
      - name: Preserve encrypted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: startup-cancellation-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
            ${{ runner.temp }}/primary-source-positive/evidence.cms
            ${{ runner.temp }}/primary-source-positive/safe-provenance.json
          if-no-files-found: error
          retention-days: 90

  controlled-backend-postimage-diagnosis:
    name: Bounded original backend variants (${{ matrix.group }})
    if: ${{ github.ref == 'refs/heads/codex/source-guard-structured-20261018-source-composition-postimages-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: postimages-1
            cases: tests/test_controlled_acp_cancel.py::test_owned_cancel_wire_and_cleanup[pending] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[before-send-connected] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[before-send-connecting] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[before-send-disabled] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[before-send-errored] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[before-send-unknown] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[parked-connected] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[parked-connecting] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[parked-disabled] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[parked-errored] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[parked-unknown] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[startup-connected] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[startup-connecting] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[startup-disabled] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[startup-errored] tests/test_controlled_acp_warnings.py::test_original_owner_warning_state_and_phase[startup-unknown] tests/test_controlled_acp_warnings.py::test_original_private_large_config[drift] tests/test_controlled_acp_warnings.py::test_original_private_large_config[eof] tests/test_controlled_acp_warnings.py::test_original_private_large_config[error] tests/test_controlled_acp_warnings.py::test_original_private_large_config[ready]
          - group: postimages-2
            cases: tests/test_controlled_acp_warnings.py::test_owned_warning_refusal_and_cleanup[late-cancel] tests/test_controlled_acp_warnings.py::test_owned_warning_refusal_and_cleanup[malformed] tests/test_controlled_acp_warnings.py::test_owned_warning_refusal_and_cleanup[unsupported] tests/test_controlled_acp_warnings.py::test_owned_warning_refusal_and_cleanup[wrong-callback] tests/test_experimental_admission_bounds.py::test_owner_adapter_bound_privacy_first_failure_cleanup_no_send[aggregate_bound] tests/test_experimental_admission_bounds.py::test_owner_adapter_bound_privacy_first_failure_cleanup_no_send[eof] tests/test_experimental_admission_bounds.py::test_owner_adapter_bound_privacy_first_failure_cleanup_no_send[frame_bound] tests/test_experimental_admission_bounds.py::test_owner_adapter_bound_privacy_first_failure_cleanup_no_send[frame_count_bound] tests/test_experimental_admission_bounds.py::test_owner_adapter_bound_privacy_first_failure_cleanup_no_send[reader_limit] tests/test_experimental_admission_bounds.py::test_owner_adapter_bound_privacy_first_failure_cleanup_no_send[unterminated_frame] tests/test_experimental_bridge_shutdown.py::test_owned_teardown_completes_after_native_drain_failure tests/test_experimental_config_frames.py::test_pinned_adapter_large_private_and_adapter_replies[drift] tests/test_experimental_config_frames.py::test_pinned_adapter_large_private_and_adapter_replies[eof] tests/test_experimental_config_frames.py::test_pinned_adapter_large_private_and_adapter_replies[error] tests/test_experimental_config_frames.py::test_pinned_adapter_large_private_and_adapter_replies[ready]
          - group: postimages-3
            cases: tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[before-send-connected] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[before-send-connecting] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[before-send-disabled] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[before-send-errored] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[before-send-unknown] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[parked-connected] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[parked-connecting] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[parked-disabled] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[parked-errored] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[parked-unknown] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[startup-connected] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[startup-connecting] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[startup-disabled] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[startup-errored] tests/test_experimental_notifications.py::test_controlled_process_http_revocation_and_warning_privacy[startup-unknown]
          - group: postimages-4
            cases: tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[2-1] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[2-2] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[2-3] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[2-4] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[2-8] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[4-1] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[4-2] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[4-3] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[4-4] tests/test_experimental_finite_orders.py::test_actual_capacity_and_parking[4-8]
          - group: postimages-5
            cases: tests/test_experimental_finite_orders.py::test_actual_simultaneous_completion_batches[validators0-workers0] tests/test_experimental_finite_orders.py::test_actual_simultaneous_completion_batches[validators0-workers1] tests/test_experimental_finite_orders.py::test_actual_simultaneous_completion_batches[validators1-workers0] tests/test_experimental_finite_orders.py::test_actual_simultaneous_completion_batches[validators1-workers1] tests/test_experimental_finite_orders.py::test_script_order_boundaries[alternating-first-PP] tests/test_experimental_finite_orders.py::test_script_order_boundaries[alternating-first-RC] tests/test_experimental_finite_orders.py::test_script_order_boundaries[alternating-first-RP] tests/test_experimental_finite_orders.py::test_script_order_boundaries[alternating-first-RR] tests/test_experimental_finite_orders.py::test_script_order_boundaries[alternating-second-PP] tests/test_experimental_finite_orders.py::test_script_order_boundaries[alternating-second-RC]
          - group: postimages-6
            cases: tests/test_experimental_finite_orders.py::test_script_order_boundaries[alternating-second-RP] tests/test_experimental_finite_orders.py::test_script_order_boundaries[alternating-second-RR] tests/test_experimental_finite_orders.py::test_script_order_boundaries[first-PP] tests/test_experimental_finite_orders.py::test_script_order_boundaries[first-RC] tests/test_experimental_finite_orders.py::test_script_order_boundaries[first-RP] tests/test_experimental_finite_orders.py::test_script_order_boundaries[first-RR] tests/test_experimental_finite_orders.py::test_script_order_boundaries[second-PP] tests/test_experimental_finite_orders.py::test_script_order_boundaries[second-RC] tests/test_experimental_finite_orders.py::test_script_order_boundaries[second-RP] tests/test_experimental_finite_orders.py::test_script_order_boundaries[second-RR]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Original compartment controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Original controlled backend variant cases
        run: env -u CODEX_PATH uv run pytest -q ${{ matrix.cases }}
        shell: python3 .github/release-source-guard/ci_shell.py --source-test TEST-positive {0}
      - name: Preserve encrypted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: controlled-backend-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
            ${{ runner.temp }}/primary-source-positive/evidence.cms
            ${{ runner.temp }}/primary-source-positive/safe-provenance.json
          if-no-files-found: error
          retention-days: 90
