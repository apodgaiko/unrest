name: v0.4.6 source guard readiness

on:
  push:
    branches:
      - 'codex/source-guard-structured-20261018-*'

permissions:
  contents: read

concurrency:
  group: v046-source-checkpoint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compartment-controls:
    if: ${{ github.ref != 'refs/heads/codex/source-guard-structured-20261018-source-composition-startup-cancel-20261021' && github.ref != 'refs/heads/codex/source-guard-structured-20261018-source-composition-postimages-20261022' }}
    name: Linux compartment controls (not a source checkpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Synthetic kernel and observer controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Physical FULL input controls on trusted host
        if: ${{ contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: python3 .github/release-source-guard/full_input_controls.py
      - name: Prepare current FULL input on trusted host
        if: ${{ contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: python3 .github/release-source-guard/full_bootstrap.py PREPAREONLY
      - name: Prepare FULL capsule without SOURCE dispatch
        if: ${{ contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: env -u CODEX_PATH uv run pytest -q
        shell: python3 .github/release-source-guard/ci_shell.py --prepare-full {0}
      - name: Upload dispatch-free FULL preparation
        if: ${{ always() && contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-full-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-source/preparation.json
            ${{ runner.temp }}/full-host-controls.json
          if-no-files-found: error
      - name: TEST original PRIMARY build producer
        if: ${{ !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: uv build
        shell: python3 .github/release-source-guard/ci_shell.py --package-test {0}
      - name: TEST original PRIMARY archive consumer
        if: ${{ !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: uv run python tools/check_distribution.py dist
        shell: python3 .github/release-source-guard/ci_shell.py --package-test {0}
      - name: TEST original PRIMARY installed consumer
        if: ${{ !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: |
          uv venv --clear .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest" --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest" measure-baseline --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest-server" --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -m unrest_harness --help
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c "from unrest_harness.config import HarnessConfig; assert HarnessConfig.discover().capability_policy.schema_version == 1"
          env -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN -u CODEX_API_KEY -u GLM_API_KEY -u OPENAI_API_KEY -u ZAI_API_KEY "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -m unrest_harness.installed_wheel_check
          set +e
          output="$(UNREST_CAPABILITY_PROFILE=unsupported "$GITHUB_WORKSPACE/.wheel-venv/bin/unrest-server" --mode orchestrator 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = "unrest-server: startup configuration rejected"
        shell: python3 .github/release-source-guard/ci_shell.py --package-test {0}
      - name: Upload encrypted TEST package installed evidence
        if: ${{ always() && !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-package-installed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-package-installed/evidence.cms
            ${{ runner.temp }}/primary-package-installed/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: TEST original PRIMARY checksum consumer
        if: ${{ !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        run: |
          test -f dist/unrest_harness-0.4.7-py3-none-any.whl
          test -f dist/unrest_harness-0.4.7.tar.gz
          cd dist
          sha256sum \
            unrest_harness-0.4.7-py3-none-any.whl \
            unrest_harness-0.4.7.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
        shell: python3 .github/release-source-guard/ci_shell.py --package-test {0}
      - name: Upload encrypted TEST package checksum evidence
        if: ${{ always() && !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-package-checksum-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-package-checksum/evidence.cms
            ${{ runner.temp }}/primary-package-checksum/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted TEST package archive evidence
        if: ${{ always() && !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-package-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-package-archive/evidence.cms
            ${{ runner.temp }}/primary-package-archive/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted TEST package build evidence
        if: ${{ always() && !contains(github.ref, 'source-guard-structured-20261018-full-bootstrap') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-package-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-package-build/evidence.cms
            ${{ runner.temp }}/primary-package-build/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload primary typed startup stage
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-host-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-host-stage.json
            ${{ runner.temp }}/primary-image-stage.json
          if-no-files-found: error
      - name: Upload encrypted control evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
          if-no-files-found: error
          retention-days: 30

  startup-cancellation-diagnosis:
    name: Bounded startup cancellation diagnosis (not certification)
    if: ${{ github.ref == 'refs/heads/codex/source-guard-structured-20261018-source-composition-startup-cancel-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Source-bound guard fixture controls (not source checkpoint)
        run: PYTHONDONTWRITEBYTECODE=1 env -u CODEX_PATH uv run pytest -q .github/release-source-guard/test_stdlib_backend.py .github/release-source-guard/test_stdlib_acp.py .github/release-source-guard/test_approval_stdlib.py .github/release-source-guard/test_c1_witness.py .github/release-source-guard/test_orders_launch_token.py .github/release-source-guard/test_role_pipe_custody.py .github/release-source-guard/test_event_journal.py .github/release-source-guard/test_journal_files.py .github/release-source-guard/test_journal_append.py .github/release-source-guard/test_journal_census.py .github/release-source-guard/test_journal_supervisor.py .github/release-source-guard/test_journal_service.py .github/release-source-guard/test_trace_tick_schedule.py .github/release-source-guard/test_startup_journal_control.py .github/release-source-guard/test_source_resources.py .github/release-source-guard/test_filesystem_telemetry.py .github/release-source-guard/test_launch_journal.py
      - name: Original compartment controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Original loaded C1 gate (not a full source checkpoint)
        run: env -u CODEX_PATH uv run pytest -q tests/test_acp_runner.py::test_run_node_with_mock_agent tests/test_controlled_python_acp.py::test_single_c1_fixed_timing_protocol_witness
        shell: python3 .github/release-source-guard/ci_shell.py --source-test TEST-positive {0}
      - name: Preserve encrypted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: startup-cancellation-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
            ${{ runner.temp }}/primary-source-positive/evidence.cms
            ${{ runner.temp }}/primary-source-positive/safe-provenance.json
          if-no-files-found: error
          retention-days: 90

  controlled-backend-postimage-diagnosis:
    name: Bounded original backend variants (${{ matrix.group }})
    if: ${{ github.ref == 'refs/heads/codex/source-guard-structured-20261018-source-composition-postimages-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: postimages-1
            cases: tests/test_approval_recovery.py::test_durable_run_owner_and_restart_never_revives[success]
          - group: postimages-2
            cases: tests/test_controlled_python_acp.py::test_cancel_at_actual_boundary[backend_registered] tests/test_controlled_python_acp.py::test_cancel_at_actual_boundary[adapter_registered] tests/test_controlled_python_acp.py::test_cancel_at_actual_boundary[auth] tests/test_controlled_python_acp.py::test_cancel_at_actual_boundary[forwarding]
          - group: postimages-3
            cases: tests/test_acp_cleanup.py::test_recorded_transport_failures[deep_json-work] tests/test_acp_cleanup.py::test_recorded_transport_failures[deep_json-validate] tests/test_acp_cleanup.py::test_recorded_transport_failures[deep_json-terminal_reviewer]
          - group: postimages-4
            cases: tests/test_acp_cleanup.py::test_recorded_transport_failures[array_id-work] tests/test_acp_cleanup.py::test_recorded_transport_failures[array_id-validate] tests/test_acp_cleanup.py::test_recorded_transport_failures[array_id-terminal_reviewer]
          - group: postimages-5
            cases: tests/test_acp_cleanup.py::test_recorded_transport_failures[object_id-work] tests/test_acp_cleanup.py::test_recorded_transport_failures[object_id-validate] tests/test_acp_cleanup.py::test_recorded_transport_failures[object_id-terminal_reviewer]
          - group: postimages-6
            cases: tests/test_acp_cleanup.py::test_recorded_transport_failures[success-work] tests/test_acp_cleanup.py::test_recorded_transport_failures[success-validate] tests/test_acp_cleanup.py::test_recorded_transport_failures[success-terminal_reviewer]
          - group: postimages-7
            cases: tests/test_controlled_python_acp.py::test_actual_registration[delayed-1] tests/test_controlled_python_acp.py::test_actual_registration[delayed-2] tests/test_controlled_python_acp.py::test_actual_registration[late-1] tests/test_controlled_python_acp.py::test_actual_registration[late-2]
          - group: postimages-8
            cases: tests/test_controlled_python_acp.py::test_actual_registration[delayed-1] tests/test_controlled_python_acp.py::test_actual_registration[delayed-2] tests/test_controlled_python_acp.py::test_actual_registration[late-1] tests/test_controlled_python_acp.py::test_actual_registration[late-2] tests/test_controlled_python_acp.py::test_cancel_at_actual_boundary[forwarding]
          - group: postimages-9
            cases: tests/test_controlled_python_acp.py::test_programmatic_private_preflight tests/test_experimental_startup_diagnostics.py::test_initialization_probe_real_controlled_path_no_prompt tests/test_experimental_startup_diagnostics.py::test_bridge_failure_preserved_through_owned_close[refusal] tests/test_experimental_startup_diagnostics.py::test_bridge_failure_preserved_through_owned_close[timeout] tests/test_experimental_startup_diagnostics.py::test_bridge_failure_preserved_through_owned_close[permission] tests/test_experimental_startup_diagnostics.py::test_initialized_owner_has_no_http_mutation_authority tests/test_experimental_startup_diagnostics.py::test_coordinator_persists_startup_and_separate_cleanup_failure tests/test_experimental_startup_diagnostics.py::test_broker_start_preserves_primary_over_cleanup tests/test_controlled_python_acp.py::test_native_pin_refusal_stays_native[launcher] tests/test_controlled_python_acp.py::test_native_pin_refusal_stays_native[runtime]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Source-bound guard fixture controls (not source checkpoint)
        run: PYTHONDONTWRITEBYTECODE=1 env -u CODEX_PATH uv run pytest -q .github/release-source-guard/test_stdlib_backend.py .github/release-source-guard/test_stdlib_acp.py
      - name: Original compartment controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Original controlled backend variant cases
        run: env -u CODEX_PATH uv run pytest -q ${{ matrix.cases }}
        shell: python3 .github/release-source-guard/ci_shell.py --source-test TEST-positive {0}
      - name: Preserve encrypted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: controlled-backend-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
            ${{ runner.temp }}/primary-source-positive/evidence.cms
            ${{ runner.temp }}/primary-source-positive/safe-provenance.json
          if-no-files-found: error
          retention-days: 90

  workspace-git-diagnosis:
    name: Bounded original workspace Git module checks (not certification)
    if: ${{ github.ref == 'refs/heads/codex/source-guard-structured-20261018-source-composition-startup-cancel-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Workspace Git binding controls
        run: PYTHONDONTWRITEBYTECODE=1 env -u CODEX_PATH uv run pytest -q .github/release-source-guard/test_workspace_git.py
      - name: Workspace compartment controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: All original evolution and workspace cases (not source checkpoint)
        run: env -u CODEX_PATH uv run pytest -q tests/test_evolution.py::test_campaign_freeze_is_complete_immutable_and_restartable tests/test_evolution.py::test_genealogy_retains_failures_retries_and_rejections tests/test_evolution.py::test_independent_evaluation_review_and_reward_hack_fail_closed tests/test_evolution.py::test_missing_provider_is_non_improving_and_cannot_promote tests/test_evolution.py::test_human_promotion_is_exact_atomic_and_idempotent tests/test_evolution.py::test_post_accept_receipt_failure_reconciles_without_reapply tests/test_evolution.py::test_exact_human_rollback_and_receipt_recovery tests/test_evolution.py::test_rollback_transaction_recovers_each_git_boundary[pre_ref] tests/test_evolution.py::test_rollback_transaction_recovers_each_git_boundary[post_ref] tests/test_evolution.py::test_rollback_transaction_recovers_each_git_boundary[post_receipt] tests/test_evolution.py::test_rollback_validation_failure_preserves_current tests/test_workspaces.py::test_exact_clean_base_scope_and_t1_label_survive_restart tests/test_workspaces.py::test_two_leases_use_distinct_worktrees_and_scope_escape_fails tests/test_workspaces.py::test_return_is_identity_bound_append_only_and_parent_is_unchanged tests/test_workspaces.py::test_disjoint_returns_integrate_in_deterministic_order tests/test_workspaces.py::test_overlap_stale_and_validation_failure_preserve_parent tests/test_workspaces.py::test_expiry_orphan_cleanup_and_retry_preserve_evidence tests/test_workspaces.py::test_child_commit_is_not_parent_authority tests/test_workspaces.py::test_owned_process_budget_and_restart_cleanup tests/test_workspaces.py::test_mutated_patch_artifact_and_cleanup_failure_are_retained tests/test_workspaces.py::test_closed_plan_rejects_nonhuman_and_swapped_mission_proofs tests/test_workspaces.py::test_integration_transaction_recovers_each_git_boundary[pre_ref] tests/test_workspaces.py::test_integration_transaction_recovers_each_git_boundary[post_ref] tests/test_workspaces.py::test_integration_transaction_recovers_each_git_boundary[post_receipt]
        shell: python3 .github/release-source-guard/ci_shell.py --source-test TEST-positive {0}
      - name: Preserve encrypted workspace Git diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: workspace-git-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
            ${{ runner.temp }}/primary-source-positive/evidence.cms
            ${{ runner.temp }}/primary-source-positive/safe-provenance.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-original-diagnosis:
    name: Bounded original bootstrap module checks (not certification)
    if: ${{ github.ref == 'refs/heads/codex/source-guard-structured-20261018-source-composition-startup-cancel-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Workspace Git binding controls
        run: PYTHONDONTWRITEBYTECODE=1 env -u CODEX_PATH uv run pytest -q .github/release-source-guard/test_workspace_git.py
      - name: Original bootstrap binding controls
        run: PYTHONDONTWRITEBYTECODE=1 env -u CODEX_PATH uv run pytest -q .github/release-source-guard/test_delayed_bootstrap.py .github/release-source-guard/test_bootstrap_stdlib.py .github/release-source-guard/test_stdlib_acp.py .github/release-source-guard/test_stdlib_backend.py .github/release-source-guard/test_connected_observation.py .github/release-source-guard/test_queued_connection.py .github/release-source-guard/test_ready_projection.py
      - name: Workspace compartment controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: All original bootstrap cases (not source checkpoint)
        run: env -u CODEX_PATH uv run pytest -q tests/test_experimental_bootstrap.py::test_actual_thirty_two_second_readiness tests/test_experimental_bootstrap.py::test_actual_launch_lifetime_and_interruptions[near] tests/test_experimental_bootstrap.py::test_actual_launch_lifetime_and_interruptions[exhausted] tests/test_experimental_bootstrap.py::test_actual_launch_lifetime_and_interruptions[cancel] tests/test_experimental_bootstrap.py::test_actual_launch_lifetime_and_interruptions[stop] tests/test_experimental_bootstrap.py::test_phases_share_one_deadline_across_tasks tests/test_experimental_bootstrap.py::test_absolute_ledger_includes_setup_and_cleanup tests/test_experimental_bootstrap.py::test_capped_body_free_observation_is_pre_cleanup tests/test_experimental_bootstrap.py::test_turn_reservation_does_not_restart_clock_after_bootstrap tests/test_experimental_bootstrap.py::test_delayed_turn_uses_only_original_remaining_time tests/test_experimental_bootstrap.py::test_original_limits_refuse_before_grant_or_send[False-turn] tests/test_experimental_bootstrap.py::test_original_limits_refuse_before_grant_or_send[False-episode] tests/test_experimental_bootstrap.py::test_original_limits_refuse_before_grant_or_send[False-campaign] tests/test_experimental_bootstrap.py::test_original_limits_refuse_before_grant_or_send[True-turn] tests/test_experimental_bootstrap.py::test_original_limits_refuse_before_grant_or_send[True-episode] tests/test_experimental_bootstrap.py::test_original_limits_refuse_before_grant_or_send[True-campaign] tests/test_experimental_bootstrap.py::test_boundary_recheck_blocks_expired_or_stopped_send[expire-reserve] tests/test_experimental_bootstrap.py::test_boundary_recheck_blocks_expired_or_stopped_send[expire-grant] tests/test_experimental_bootstrap.py::test_boundary_recheck_blocks_expired_or_stopped_send[expire-send] tests/test_experimental_bootstrap.py::test_boundary_recheck_blocks_expired_or_stopped_send[expire-serialize] tests/test_experimental_bootstrap.py::test_boundary_recheck_blocks_expired_or_stopped_send[stop-reserve] tests/test_experimental_bootstrap.py::test_boundary_recheck_blocks_expired_or_stopped_send[stop-grant] tests/test_experimental_bootstrap.py::test_boundary_recheck_blocks_expired_or_stopped_send[stop-send] tests/test_experimental_bootstrap.py::test_boundary_recheck_blocks_expired_or_stopped_send[stop-serialize] tests/test_experimental_bootstrap.py::test_actual_sequential_initialize_and_session_share_cutoff tests/test_experimental_bootstrap.py::test_startup_subtracts_from_actual_inference_timeout tests/test_experimental_bootstrap.py::test_expiry_during_seal_cannot_publish_grant
        shell: python3 .github/release-source-guard/ci_shell.py --source-test TEST-positive {0}
      - name: Preserve encrypted bootstrap diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bootstrap-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
            ${{ runner.temp }}/primary-source-positive/evidence.cms
            ${{ runner.temp }}/primary-source-positive/safe-provenance.json
          if-no-files-found: error
          retention-days: 90
