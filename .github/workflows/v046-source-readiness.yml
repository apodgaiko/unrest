name: v0.4.6 source guard readiness

on:
  push:
    branches:
      - 'codex/source-guard-structured-20261018-*'

permissions:
  contents: read

concurrency:
  group: v046-source-checkpoint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compartment-controls:
    name: Linux compartment controls (not a source checkpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic kernel and observer controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Lint (ruff)
        run: uv run ruff check .
        shell: python3 .github/release-source-guard/ci_shell.py {0}
      - name: Type-check (mypy)
        run: uv run mypy src
        shell: python3 .github/release-source-guard/ci_shell.py {0}
      - name: Upload encrypted primary static-check evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-lint/evidence.cms
            ${{ runner.temp }}/primary-lint/safe-provenance.json
            ${{ runner.temp }}/primary-types/evidence.cms
            ${{ runner.temp }}/primary-types/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload primary typed startup stage
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-primary-host-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/primary-host-stage.json
            ${{ runner.temp }}/primary-image-stage.json
          if-no-files-found: error
      - name: Upload encrypted control evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
