name: v0.4.6 source guard readiness

on:
  push:
    branches:
      - 'codex/source-guard-readiness-20261017-*'

permissions:
  contents: read

concurrency:
  group: v046-source-checkpoint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compartment-controls:
    name: Linux compartment controls (not a source checkpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic kernel and observer controls
        run: python3 .github/release-source-guard/probe_controller.py "$RUNNER_TEMP/source-readiness"
      - name: Original four in-process restart parameters after native predicate change
        run: python3 .github/release-source-guard/source_controller.py "$RUNNER_TEMP/source-unit" "$RUNNER_TEMP/source-readiness"
      - name: Whole original composed restart, stop, replacement and cancel source case
        run: python3 .github/release-source-guard/source_controller.py "$RUNNER_TEMP/source-composed" "$RUNNER_TEMP/source-readiness" composed
      - name: Upload encrypted original in-process source evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-unit/evidence.cms
            ${{ runner.temp }}/source-unit/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted composed-source evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-composed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-composed/evidence.cms
            ${{ runner.temp }}/source-composed/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted control evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v046-source-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-readiness/evidence.cms
            ${{ runner.temp }}/source-readiness/safe-provenance.json
          if-no-files-found: error
          retention-days: 30
